<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ИИ прогноз плана</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <a class="brand" href="/">ИИ прогноз плана</a>
      <p class="topbar-subtitle">Прогноз спроса и почасовой профиль продаж</p>
    </div>
    {% if auth %}
    <div class="user-pill">
      <span>{{ auth.user_name or auth.email or "Пользователь" }}</span>
      {% if is_admin %}<strong>админ</strong>{% endif %}
    </div>
    {% endif %}
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
